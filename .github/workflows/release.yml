# Releases the version in package.json when the matching tag v<version> is pushed: reruns CI,
# scans, pushes the multi-arch image and signs it with cosign keyless (ci-release door 2).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag:
    name: tag matches package.json
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-release-tag.sh "$GITHUB_REF_NAME"

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish and sign
    needs: [tag, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      # the OIDC token Sigstore binds the signature to
      id-token: write
    env:
      IMAGE_REPO: docker.io/lrambo/posts-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: scripts/image.sh build
      - run: scripts/image.sh scan
      - run: scripts/image.sh push
      - name: sign the pushed digest
        run: |
          version="${GITHUB_REF_NAME#v}"
          digest="$(docker buildx imagetools inspect "$IMAGE_REPO:$version" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "$IMAGE_REPO@$digest"
