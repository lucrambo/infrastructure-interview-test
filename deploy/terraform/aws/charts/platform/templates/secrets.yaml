# Secrets come from AWS Secrets Manager; External Secrets authenticates with EKS Pod Identity.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: posts
---
# the chart's database.existingSecret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: posts-db
  namespace: posts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: posts-db
  data:
    - secretKey: password
      remoteRef:
        key: {{ .Values.appSecretName }}
        property: password
---
apiVersion: v1
kind: Namespace
metadata:
  name: database-init
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-init
  namespace: database-init
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: database-init
  data:
    - secretKey: master-username
      remoteRef:
        key: {{ .Values.masterSecretArn }}
        property: username
    - secretKey: master-password
      remoteRef:
        key: {{ .Values.masterSecretArn }}
        property: password
    - secretKey: app-password
      remoteRef:
        key: {{ .Values.appSecretName }}
        property: password
