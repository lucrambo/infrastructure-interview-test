{{- include "posts-api.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "posts-api.fullname" . }}
  labels:
    {{- include "posts-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "posts-api.apiSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # never fewer ready replicas than desired during a rollout
      maxUnavailable: 0
      maxSurge: 25%
  template:
    metadata:
      labels:
        {{- include "posts-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # rolls the pods when the configuration or the password changes
        checksum/config: {{ printf "%s\n%s" (include "posts-api.configData" .) .Values.database.password | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "posts-api.fullname" . }}
      automountServiceAccountToken: false
      {{- include "posts-api.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "posts-api.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        # hard: a zone outage must never take more than its share of replicas
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "posts-api.apiSelectorLabels" . | nindent 14 }}
        # soft: spread over nodes inside a zone when capacity allows
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "posts-api.apiSelectorLabels" . | nindent 14 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "posts-api.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- include "posts-api.env" . | nindent 10 }}
          securityContext:
            {{- include "posts-api.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          lifecycle:
            preStop:
              # distroless has no shell, so the kubelet sleeps natively
              sleep:
                seconds: {{ .Values.preStopSleepSeconds }}
