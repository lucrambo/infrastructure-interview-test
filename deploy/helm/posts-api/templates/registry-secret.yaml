{{- with .Values.imageCredentials }}
{{- if .registry }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "posts-api.registrySecretName" $ }}
  labels:
    {{- include "posts-api.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  {{- $auth := printf "%s:%s" .username .password | b64enc }}
  .dockerconfigjson: {{ dict "auths" (dict .registry (dict "username" .username "password" .password "auth" $auth)) | toJson | b64enc | quote }}
{{- end }}
{{- end }}
