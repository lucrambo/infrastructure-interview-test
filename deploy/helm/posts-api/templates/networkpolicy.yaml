{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "posts-api.fullname" . }}
  labels:
    {{- include "posts-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "posts-api.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # the gateway proxies and the metrics scraper; kubelet probes are not subject to policies
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # the database may live outside the cluster (RDS), so the rule is by port only. Policies see
    # the destination pod's port: behind a Service that remaps it (MySQL Router: 3306 -> 6446),
    # list the pod port in networkPolicy.extraEgressPorts.
    - ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
        {{- range .Values.networkPolicy.extraEgressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
